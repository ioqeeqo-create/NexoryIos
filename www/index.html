<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06080d" />
  <title>Nexory</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app-bg"></div>
  <div id="setup-gate" class="setup-gate" hidden>
    <img class="setup-gate__logo" src="assets/flow-mark.svg" alt="Nexory" />
    <h1 class="setup-gate__title pixel">NEXORY</h1>
    <p class="setup-gate__text">Подключи gateway и токены — без этого музыка не играет.</p>
    <button type="button" class="primary-btn" id="setup-gate-btn">Открыть настройки</button>
  </div>

  <div id="app">
    <header class="top-bar safe-top">
      <div class="top-bar__brand">
        <img class="brand-mark" src="assets/flow-mark.svg" alt="" />
        <span class="brand-pixel">NEXORY</span>
      </div>
      <button type="button" class="icon-btn" id="btn-search-open" aria-label="Поиск" data-icon="search"></button>
    </header>

    <main id="screens">
      <section class="screen screen--active" data-screen="home">
        <div class="wave-hero">
          <button type="button" class="wave-orb" id="btn-wave-play">
            <span class="wave-orb__glow"></span>
            <img class="wave-orb__img" src="assets/source-yandex-wave.svg" alt="" />
          </button>
          <h1 class="wave-title pixel">Моя волна</h1>
          <p class="wave-sub" id="wave-source-label">Нажми — погрузиться в волну</p>
        </div>
        <div class="section">
          <div class="section-head"><h2 class="section-title pixel">Недавние</h2></div>
          <div class="h-scroll" id="recent-list"></div>
        </div>
        <div class="section">
          <div class="section-head">
            <h2 class="section-title pixel">Любимые</h2>
            <button type="button" class="link-btn" data-goto="library">Все</button>
          </div>
          <div class="h-scroll" id="favorites-preview"></div>
        </div>
        <div class="section">
          <div class="section-head"><h2 class="section-title pixel">Популярное</h2></div>>
          <div class="chip-row" id="popular-chips">
            <button type="button" class="chip chip--active" data-popular="yandex">Яндекс</button>
            <button type="button" class="chip" data-popular="vk">VK</button>
            <button type="button" class="chip" data-popular="soundcloud">SC</button>
          </div>
          <div class="v-list" id="popular-list"></div>
        </div>
      </section>

      <section class="screen" data-screen="search">
        <div class="search-box">
          <span class="search-box__icon" data-icon="search"></span>
          <input type="search" id="search-input" placeholder="Трек, артист..." autocomplete="off" enterkeyhint="search" />
          <button type="button" class="search-clear" id="search-clear" hidden>×</button>
        </div>
        <div class="chip-row" id="search-source-chips">
          <button type="button" class="chip chip--active" data-source="yandex">Яндекс</button>
          <button type="button" class="chip" data-source="vk">VK</button>
          <button type="button" class="chip" data-source="soundcloud">SC</button>
        </div>
        <div class="search-status" id="search-status"></div>
        <div class="v-list v-list--tracks" id="search-results"></div>>
      </section>

      <section class="screen" data-screen="library">
        <h1 class="screen-title pixel">Библиотека</h1>
        <div class="lib-actions">
          <button type="button" class="lib-card" id="btn-create-playlist"><span class="lib-card__icon" data-icon="plus"></span><span>Создать плейлист</span></button>
        </div>
        <div class="section">
          <h2 class="section-title pixel">Любимые</h2>
          <div class="v-list v-list--tracks" id="library-likes"></div>
        </div>
        <div class="section">
          <h2 class="section-title pixel">Плейлисты</h2>
          <div id="library-playlists"></div>
        </div>
      </section>

      <section class="screen" data-screen="settings">
        <h1 class="screen-title pixel">Настройки</h1>
        <div class="settings-group">
          <label class="field"><span>Gateway URL</span><input type="url" id="cfg-gateway" placeholder="http://IP:3950" autocapitalize="off" /></label>
          <label class="field"><span>Gateway Secret</span><input type="password" id="cfg-secret" placeholder="Bearer secret" autocomplete="off" /></label>
          <button type="button" class="secondary-btn" id="btn-test-gateway">Проверить gateway</button>
          <small class="field-hint" id="gateway-status"></small>
        </div>
        <div class="settings-group">
          <h3 class="settings-label pixel">Сервисы</h3>
          <label class="field"><span>Яндекс OAuth</span><textarea id="cfg-yandex" rows="2" placeholder="OAuth токен"></textarea><small class="field-hint" id="yandex-status"></small></label>
          <label class="field"><span>VK access_token</span><textarea id="cfg-vk" rows="2" placeholder="access_token"></textarea><small class="field-hint" id="vk-status"></small></label>
          <label class="field"><span>SoundCloud client_id (опц.)</span><input type="text" id="cfg-sc" placeholder="Авто через gateway" /></label>
        </div>
        <button type="button" class="primary-btn" id="btn-save-settings">Сохранить</button>
      </section>
    </main>

    <footer class="mini-player safe-bottom" id="mini-player" hidden>
      <button type="button" class="mini-player__main" id="mini-open-full">
        <div class="mini-cover-wrap" id="mini-cover-wrap"><span data-icon="music-2" data-icon-class="ui-icon cover-ph"></span></div>>
        <div class="mini-meta">
          <div class="mini-title" id="mini-title">—</div>
          <div class="mini-artist" id="mini-artist">—</div>
        </div>
      </button>
      <div class="mini-controls">
        <button type="button" class="icon-btn icon-btn--sm" id="mini-play" data-icon="play"></button>
      </div>
    </footer>

    <nav class="tab-bar safe-bottom" id="tab-bar">
      <button type="button" class="tab tab--active" data-tab="home" data-icon="home"><span>Главная</span></button>
      <button type="button" class="tab" data-tab="library" data-icon="library"><span>Библиотека</span></button>
      <button type="button" class="tab" data-tab="settings" data-icon="settings"><span>Настройки</span></button>
    </nav>
  </div>

  <div class="full-player" id="full-player" hidden>
    <div class="full-player__bg" id="full-bg"></div>
    <div class="full-player__content safe-top safe-bottom">
      <button type="button" class="full-player__close" id="full-close" data-icon="chevron-down"></button>
      <p class="full-player__source pixel" id="full-from"></p>
      <div class="full-cover-wrap" id="full-cover-wrap">
        <span class="full-cover-ph" data-icon="music-2" data-icon-class="ui-icon lg cover-ph"></span>
        <img class="full-cover" id="full-cover" alt="" hidden />
      </div>
      <div class="full-meta">
        <h2 class="full-title pixel" id="full-title">—</h2>
        <p class="full-artist" id="full-artist">—</p>
      </div>
      <div class="waveform" id="waveform" aria-hidden="true"></div>
      <div class="progress-row">
        <span class="time pixel" id="time-current">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="1000" value="0" />
        <span class="time pixel" id="time-total">0:00</span>
      </div>
      <div class="full-controls">
        <button type="button" class="icon-btn" id="full-shuffle" data-icon="shuffle" aria-label="Shuffle"></button>
        <button type="button" class="icon-btn icon-btn--lg" id="full-prev" data-icon="skip-back"></button>
        <button type="button" class="icon-btn icon-btn--xl" id="full-play" data-icon="play"></button>
        <button type="button" class="icon-btn icon-btn--lg" id="full-next" data-icon="skip-forward"></button>
        <button type="button" class="icon-btn" id="full-like" data-icon="heart" aria-label="Like"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <audio id="audio" preload="metadata" playsinline webkit-playsinline crossorigin="anonymous"></audio>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
