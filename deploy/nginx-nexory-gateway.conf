# Прокси Nexory gateway через nginx (порт 80 уже открыт на Timeweb).
# На VPS:
#   sudo cp /opt/nexory/NexoryIos/deploy/nginx-nexory-gateway.conf /etc/nginx/sites-available/nexory-gateway
#   sudo ln -sf /etc/nginx/sites-available/nexory-gateway /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# В приложении Gateway URL: http://ВАШ_IP   (без :3950)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        proxy_pass http://127.0.0.1:3950/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /mobile/ {
        proxy_pass http://127.0.0.1:3950/mobile/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    location / {
        return 404;
    }
}
