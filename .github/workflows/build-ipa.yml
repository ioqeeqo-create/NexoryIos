name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build unsigned IPA
        run: bash scripts/build-ios.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexory-unsigned-${{ github.run_number }}
          path: build/Nexory.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nexory iOS v1.0.${{ github.run_number }}
          files: build/Nexory.ipa
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nexory-build-debug-${{ github.run_number }}
          path: build/
          retention-days: 7
          if-no-files-found: ignore
